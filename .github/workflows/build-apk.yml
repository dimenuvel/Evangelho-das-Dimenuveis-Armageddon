name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: | 
          chmod +x gradlew ./gradlew assembleDebug --no-daemon --stacktrace 
      
      - name: Prepare APK
        run: | 
          mkdir -p release-apks cp android/app/build/outputs/apk/debug/app-debug.apk \ release-apks/Evangelho-das-Dimenuveis-Armageddon-v1.0.apk 
     
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evangelho-das-Dimenuveis-Armageddon-v1.0-APK
          path: release-apks/Evangelho-das-Dimenuveis-Armageddon-v1.0.apk
          if-no-files-found: error
          retention-days: 14
