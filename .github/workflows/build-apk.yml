name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace --no-build-cache
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Evangelho-das-Dimenuveis-Armageddon.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evangelho-das-Dimenuveis-Armageddon-APK
          path: android/app/build/outputs/apk/debug/Evangelho-das-Dimenuveis-Armageddon.apk
          retention-days: 30



        

